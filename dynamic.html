<div id="root"></div>

<script>
  function render() {
    const SELECTOR = "#root";
    const DIV = document.querySelector(SELECTOR) ;
    if (!DIV) {
      alert(`Узел не найден: ${SELECTOR} `) ;
      return;
    }
    DIV.innerHTML = `
     <button>
        <div>dynamic</div>
      </button>
    `;
  }

  render() ;
</script>
